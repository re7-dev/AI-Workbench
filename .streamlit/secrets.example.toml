# Copy into Streamlit Cloud > App settings > Secrets.
# Keep the existing DB_URI; never commit the real secrets.toml.
DB_URI = "postgresql+psycopg2://USER:PASSWORD@HOST:5432/postgres?sslmode=require"

[auth.users.admin]
role = "admin"
password_hash = "REPLACE_WITH_GENERATED_HASH"

[auth.users.viewer]
role = "viewer"
password_hash = "REPLACE_WITH_GENERATED_HASH"
